<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">OcelotGateway —— 基于 Ocelot 的 .NET 8 API 网关</title>
  <desc id="heroDesc">左侧为项目名称与定位：把多个前端站点的请求收敛到一组可自愈的下游服务。右侧为路由示意：网关监听 7000 端口，按 isvsetting、isvwechat、isvcahtsignalr 三个前缀分别转发到 setting 7010、wechat 7020、chatsignalr 7030 三个下游服务。</desc>

  <rect width="1200" height="440" rx="24" fill="#0C0E12"/>
  <rect x="0.5" y="0.5" width="1199" height="439" rx="24" fill="none" stroke="#232A34"/>

  <!-- ============ 标题区 ============ -->
  <g id="title-block" transform="translate(64 0)">
    <text y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="2.4" fill="#7B8494">API GATEWAY · .NET 8</text>

    <text y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="64" font-weight="700" fill="#F2F4F8">OcelotGateway</text>

    <text y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="24" fill="#C3CAD6">多站点请求，收敛到可自愈的下游服务</text>

    <line x1="0" y1="262" x2="96" y2="262" stroke="#4C8DFF" stroke-width="3"/>

    <text y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20" fill="#7B8494">路由转发 · 健康检查 · 钉钉告警 · 限流</text>

    <text y="344" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#5C6474">net8.0 · Ocelot 24.1 · Polly</text>
  </g>

  <!-- ============ 路由拓扑 ============ -->
  <g id="topology" transform="translate(628 20)">

    <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" fill="#7B8494">入口</text>
    <text x="300" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" fill="#7B8494">下游服务</text>

    <!-- 网关 -->
    <g id="gateway">
      <rect x="0" y="110" width="132" height="152" rx="14" fill="#12151B" stroke="#4C8DFF" stroke-opacity="0.65"/>
      <text x="66" y="150" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#4C8DFF">OCELOT</text>
      <text x="66" y="188" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" fill="#F2F4F8">:7000</text>
      <line x1="18" y1="208" x2="114" y2="208" stroke="#232A34"/>
      <text x="66" y="234" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="17" fill="#7B8494">路由 / 限流</text>
    </g>

    <!-- 连向三个下游 -->
    <g id="fan-out" fill="none" stroke="#4C8DFF" stroke-width="1.8" stroke-opacity="0.5">
      <path d="M132 186 C204 186, 232 92, 300 92"/>
      <path d="M132 186 L300 186"/>
      <path d="M132 186 C204 186, 232 280, 300 280"/>
    </g>

    <!-- 下游服务：每张卡片带自己的路由前缀 -->
    <g id="services">
      <rect x="300" y="50" width="234" height="84" rx="12" fill="#151920" stroke="#232A34"/>
      <circle cx="324" cy="80" r="5" fill="#3FB950"/>
      <text x="342" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#F2F4F8">setting</text>
      <text x="342" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#4C8DFF">/isvsetting</text>
      <text x="342" y="125" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#7B8494">127.0.0.1:7010</text>

      <rect x="300" y="144" width="234" height="84" rx="12" fill="#151920" stroke="#232A34"/>
      <circle cx="324" cy="174" r="5" fill="#3FB950"/>
      <text x="342" y="172" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#F2F4F8">wechat</text>
      <text x="342" y="198" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#4C8DFF">/isvwechat</text>
      <text x="342" y="219" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#7B8494">127.0.0.1:7020</text>

      <rect x="300" y="238" width="234" height="84" rx="12" fill="#151920" stroke="#232A34"/>
      <circle cx="324" cy="268" r="5" fill="#3FB950"/>
      <text x="342" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#F2F4F8">chatsignalr</text>
      <text x="342" y="290" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#4C8DFF">/isvcahtsignalr</text>
      <text x="342" y="311" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#7B8494">127.0.0.1:7030</text>
    </g>

    <!-- 图例 -->
    <g id="legend">
      <circle cx="306" cy="352" r="5" fill="#3FB950"/>
      <text x="322" y="358" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="17" fill="#7B8494">健康，参与负载</text>

      <circle cx="306" cy="384" r="4.5" fill="none" stroke="#E5534B" stroke-width="1.6"/>
      <text x="322" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="17" fill="#7B8494">探测失败，从可用列表剔除</text>
    </g>
  </g>
</svg>